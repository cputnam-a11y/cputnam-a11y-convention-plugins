name: publish
on: [workflow_dispatch]

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: publish
        env:
          ORG_GRADLE_PROJECT_cputnama11yMavenUsername: ${{ secrets.ORG_GRADLE_PROJECT_cputnama11yMavenUsername }}
          ORG_GRADLE_PROJECT_cputnama11yMavenPassword: ${{ secrets.ORG_GRADLE_PROJECT_cputnama11yMavenPassword }}
        run: ./gradlew publish